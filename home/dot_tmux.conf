set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'niksingh710/minimal-tmux-status'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'sainnhe/tmux-fzf'
# prefix + ? searches every prefix binding (key + description) and every tmux
# command (":" rows) at once. A key row presses that key; a command row opens the
# prompt with the command typed in. tmux-fzf's category menu stays on prefix + F.
# Without fzf, ? keeps the plain key list and .zshrc says why. The popup blocks the
# chain until it closes, so run-shell acts on the real client, not the popup.
# "##" in run-shell is a literal "#" after format expansion.
if-shell 'command -v fzf >/dev/null' {
    bind ? display-popup -E -w 90% -h 80% -T ' keys ' \
        '{ tmux list-keys -aN -P "$(tmux show -gv prefix) " | awk "\$2 !~ /Mouse|Wheel/"; tmux list-commands | sed "s/^/:    /"; } | fzf --reverse --prompt "key> " | awk "NR==1 {print \$1, \$2}" | xargs -0 tmux set -g @keypick' \
        \; run-shell 'k=$(tmux show -gqv @keypick); tmux set -gu @keypick; case "$k" in "") ;; ":"*) tmux command-prompt -t "#{client_name}" -I "${k##: } " ;; *) tmux send-keys -K -c "#{client_name}" "#{prefix}" "${k##* }" ;; esac'
}
set -g @minimal-tmux-indicator-str ' #h '      # hostname on the left, so a remote session is obvious

set -g default-shell /bin/zsh
# macOS system ncurses has no tmux-256color; apps in panes would lose their terminfo.
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
    'set -g default-terminal tmux-256color' \
    'set -g default-terminal screen-256color'
set -as terminal-features ',*:RGB,xterm*:extkeys'
# ssh does not forward COLORTERM; tmux 3.6+ sets it in panes, 3.4 does not.
set-environment -g COLORTERM truecolor
set -sg escape-time 50
set -s extended-keys on
set -s focus-events on
set -s set-clipboard on            # OSC 52 from apps in panes reaches the local clipboard over ssh
# Forward the pane title (set by the shell or app via OSC 2) to the terminal's tab.
set -g set-titles on
set -g set-titles-string '#T'
# Let apps that wrap escapes for tmux (kitty images, desktop notifications) reach the terminal.
set -g allow-passthrough on
set -g history-limit 50000
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Missing plugins install on every server start. install_plugins needs this
# variable before `run tpm` sets it, or it aborts on a fresh machine.
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins/'
if-shell 'test ! -d ~/.tmux/plugins/tpm' \
    "run-shell 'git clone -q --depth 1 https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm'"
run-shell '~/.tmux/plugins/tpm/bin/install_plugins >/dev/null'
run-shell '~/.tmux/plugins/tpm/tpm'

# Linux without linger: systemd kills the panes after the last logout. The
# segment disappears once `loginctl enable-linger` runs; WARN_LINGER=0 hides it.
if-shell '[ "${WARN_LINGER:-1}" != 0 ] && [ -d /run/systemd/system ]' {
    set -ga status-right '#[fg=yellow]#(test -e /var/lib/systemd/linger/$(id -un) || echo " linger off")#[default]'
}
