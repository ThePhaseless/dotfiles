set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'niksingh710/minimal-tmux-status'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'   # after the theme: it hooks status-right
set -g @minimal-tmux-indicator-str ' #h '      # hostname on the left, so a remote session is obvious
# Only the default server restores and autosaves; `tmux -L x` servers (tests, tools) would clone every saved session.
%if "#{==:#{b:socket_path},default}"
# Restore only once a save exists, or resurrect shows "file not found!" until the first autosave.
if-shell 'test -e ~/.tmux/resurrect/last || test -e "${XDG_DATA_HOME:-$HOME/.local/share}/tmux/resurrect/last"' \
    "set -g @continuum-restore 'on'"
%else
set -g @continuum-save-interval '0'
%endif

set -g default-shell /bin/zsh
# macOS system ncurses has no tmux-256color; apps in panes would lose their terminfo.
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
    'set -g default-terminal tmux-256color' \
    'set -g default-terminal screen-256color'
set -as terminal-features ',*:RGB,xterm*:extkeys'
# ssh does not forward COLORTERM; tmux 3.6+ sets it in panes, 3.4 does not.
set-environment -g COLORTERM truecolor
set -sg escape-time 50
set -s extended-keys on
set -s focus-events on
set -s set-clipboard on            # OSC 52 from apps in panes reaches the local clipboard over ssh
# Forward the pane title (set by the shell or app via OSC 2) to the terminal's tab.
set -g set-titles on
set -g set-titles-string '#T'
# Let apps that wrap escapes for tmux (kitty images, desktop notifications) reach the terminal.
set -g allow-passthrough on
set -g history-limit 50000
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Missing plugins install on every server start. install_plugins needs this
# variable before `run tpm` sets it, or it aborts on a fresh machine.
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins/'
if-shell 'test ! -d ~/.tmux/plugins/tpm' \
    "run-shell 'git clone -q --depth 1 https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm'"
run-shell '~/.tmux/plugins/tpm/bin/install_plugins >/dev/null'
run-shell '~/.tmux/plugins/tpm/tpm'

# Linux without linger: systemd kills the panes after the last logout. The
# segment disappears once `loginctl enable-linger` runs; TMUX_WARN=0 hides it.
if-shell '[ "${TMUX_WARN:-1}" != 0 ] && [ -d /run/systemd/system ]' {
    set -ga status-right '#[fg=yellow]#(test -e /var/lib/systemd/linger/$(id -un) || echo " linger off")#[default]'
}
