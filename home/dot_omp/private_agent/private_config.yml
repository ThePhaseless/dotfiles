setupVersion: 2
enabledProviders:
  - claude
skills:
  enableClaudeUser: true
marketplace:
  autoUpdate: auto
extensions:
  - ~/.claude/plugins/marketplaces/superpowers-dev
# claude-security runs its scan as a Claude Code Workflow script, which omp cannot
# execute; hide its skill and pipeline agents here (omp has its own security_scan tool).
disabledExtensions:
  - skill:claude-security
task:
  disabledAgents:
    - claude-security
    - explore
    - patch-generator
    - patch-verifier
    - scan-inventory
    - scan-loader
    - scan-redactor
    - scan-researcher
    - scan-verifier
